# hotspot-guard allowlist
#
# Outbound traffic is blocked unless it goes to an enabled group.
#   enabled  yes or no. Only enabled groups are allowed.
#   domains  one per line. Each name is resolved on every refresh and its
#            addresses are allowed. A name matches only itself, not its
#            subdomains, so list each subdomain you need (www.facebook.com,
#            api.anthropic.com, ...). IP addresses and CIDR ranges such as
#            203.0.113.0/24 are allowed as written.
# Lines starting with # are comments. Do not put comments after a value.

[settings]
# Allow private and LAN ranges (the hotspot itself, router, printers).
allow_local_network = yes
# Seconds between re-resolving names in watch mode. Minimum 60.
refresh_seconds = 300
# Keep addresses seen within this many hours, so a failed lookup does not cut live connections.
keep_addresses_hours = 6
# IPv6-only networks (many carrier hotspots) reach IPv4 sites through a NAT64 prefix.
# auto: find the prefix from the network (RFC 7050). off: do not. Or give a /96 prefix.
nat64_prefix = auto

[social]
enabled = yes
description = Facebook, Instagram, WhatsApp, X, TikTok, Snapchat, Reddit, LinkedIn and more
domains =
    facebook.com
    www.facebook.com
    m.facebook.com
    graph.facebook.com
    messenger.com
    fbcdn.net
    instagram.com
    www.instagram.com
    i.instagram.com
    graph.instagram.com
    cdninstagram.com
    whatsapp.com
    web.whatsapp.com
    whatsapp.net
    threads.net
    x.com
    twitter.com
    twimg.com
    t.co
    tiktok.com
    www.tiktok.com
    tiktokv.com
    tiktokcdn.com
    snapchat.com
    sc-cdn.net
    reddit.com
    www.reddit.com
    redd.it
    redditstatic.com
    redditmedia.com
    linkedin.com
    licdn.com
    pinterest.com
    pinimg.com
    bsky.app
    bsky.social
    discord.com
    discordapp.com

[claude]
# Claude Code: API, login and feature flags. Updates from downloads.claude.ai are deliberately not listed.
enabled = yes
description = Claude Code: API, login and feature flags
domains =
    anthropic.com
    api.anthropic.com
    console.anthropic.com
    statsig.anthropic.com
    claude.ai
    claude.com
    sentry.io

[dev]
# Git hosting and package downloads. Off by default. Turn on when you need to pull or push.
enabled = no
description = GitHub and npm: pull, push and package installs
domains =
    github.com
    api.github.com
    codeload.github.com
    objects.githubusercontent.com
    raw.githubusercontent.com
    registry.npmjs.org

[custom]
# Anything else you need: domains, IP addresses or CIDR ranges, one per line.
enabled = no
description = Your own domains, IP addresses or CIDR ranges
domains =
